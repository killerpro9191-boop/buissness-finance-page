<script>

'use strict';
const K='ledgerline.v2',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DC={income:['Sales','Auto Glass Services','Other Income'],expense:['Food & Meals','Bills & Utilities','Rent','Fuel & Transportation','Supplies & Materials','Tools & Equipment','Payroll','Insurance','Marketing','Repairs & Maintenance','Taxes & Fees','Miscellaneous']};
const DEF=()=>({tx:[],bills:[],cats:JSON.parse(JSON.stringify(DC)),set:{name:'My Business',cur:'USD',theme:'light'}});
const norm=o=>{const d=DEF();return{...d,...o,cats:{...d.cats,...o.cats},set:{...d.set,...o.set}}};
let S=(()=>{try{return norm(JSON.parse(localStorage.getItem(K)))}catch(e){return DEF()}})();
let P='dash',F={p:'thismonth',from:'',to:'',u:''},T={q:'',type:'',cat:'',m:'',k:'date',d:-1,pg:1},CH=[],busy=0,G='month';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return 1}catch(e){toast('Could not save: '+e.message,1)}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},today=()=>ymd(new Date()),mon=d=>add(d,-((d.getDay()+6)%7));
const money=n=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:S.set.cur}).format(n||0)}catch(e){return(n||0).toFixed(2)}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>s?pd(s).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'';
const IC={dash:'M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z',tx:'M7 4v16M7 4L3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4',bill:'M6 2h12v20l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',report:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8',tag:'M3 12V3h9l9 9-9 9zM8 8h.01',gear:'M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2',plus:'M12 5v14M5 12h14',l:'M15 6l-6 6 6 6',r:'M9 6l6 6-6 6',menu:'M4 6h16M4 12h16M4 18h16'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const NAV=[['dash','Dashboard','dash','How the business is doing in the selected period.'],['tx','Transactions','tx','Record, search and manage every sale and expense.'],['bills','Bills & Payments','bill','Track what you owe and record payments.'],['spend','Spending Analysis','chart','See where the money goes.'],['rep','Financial Reports','report','Profit and loss, summaries and exports.'],['cats','Categories','tag','Organize income and expenses your way.'],['set','Settings','gear','Business details, data and appearance.']];
function toast(m,bad){const t=$('#ts');t.textContent=m;t.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3200)}
/* periods */
function range(){const t=new Date();let f,e;switch(F.p){case'today':f=e=t;break;case'yesterday':f=e=add(t,-1);break;case'thisweek':f=mon(t);e=add(f,6);break;case'lastweek':f=add(mon(t),-7);e=add(f,6);break;
case'thismonth':f=new Date(t.getFullYear(),t.getMonth(),1);e=new Date(t.getFullYear(),t.getMonth()+1,0);break;case'lastmonth':f=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),0);break;
case'thisyear':f=new Date(t.getFullYear(),0,1);e=new Date(t.getFullYear(),11,31);break;case'lastyear':f=new Date(t.getFullYear()-1,0,1);e=new Date(t.getFullYear()-1,11,31);break;
case'custom':return{from:F.from,to:F.to};default:return{from:'',to:''}}return{from:ymd(f),to:ymd(e)}}
const unit=()=>F.u||({thismonth:'m',lastmonth:'m',thisyear:'y',lastyear:'y'})[F.p]||'d';
function shift(r,u,n){const f=pd(r.from),t=pd(r.to);let a,b;if(u==='m'){a=new Date(f.getFullYear(),f.getMonth()+n,1);b=new Date(a.getFullYear(),a.getMonth()+1,0)}else if(u==='y'){a=new Date(f.getFullYear()+n,0,1);b=new Date(a.getFullYear(),11,31)}else{const len=Math.round((t-f)/864e5)+1;a=add(f,n*len);b=add(a,len-1)}return{from:ymd(a),to:ymd(b)}}
const pr=r=>r.from&&r.to?shift(r,unit(),-1):null,inR=(d,r)=>(!r.from||d>=r.from)&&(!r.to||d<=r.to);
const label=r=>!r.from&&!r.to?'All time':r.from===r.to?dt(r.from):(r.from?dt(r.from):'Beginning')+' – '+(r.to?dt(r.to):'today');
/* calculations */
const owe=b=>Math.max(0,Math.round((b.total-b.paid)*100)/100);
function bst(b){const o=owe(b);return o===0?['Paid','b-g']:o>0&&b.due<today()?['Overdue','b-r']:b.paid>0?['Partially paid','b-a']:['Unpaid','']}
function stat(r){const l=S.tx.filter(t=>inR(t.date,r));let i=0,e=0;l.forEach(t=>t.type==='income'?i+=t.amount:e+=t.amount);return{i,e,net:i-e,n:l.length,l}}
const margin=s=>s.i>0?(s.net/s.i*100).toFixed(1)+'%':'—';
function byCat(l,ty){const o={};l.filter(t=>t.type===ty).forEach(t=>o[t.category]=(o[t.category]||0)+t.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function bk(l){const ds=l.map(t=>t.date).sort(),mo=ds.length&&(pd(ds[ds.length-1])-pd(ds[0]))/864e5>62,b={};l.forEach(t=>{const k=mo?t.date.slice(0,7):t.date,x=b[k]||(b[k]={i:0,e:0});t.type==='income'?x.i+=t.amount:x.e+=t.amount});return{mo,b,ks:Object.keys(b).sort()}}
function nextDue(s,fq){const d=pd(s);if(fq==='weekly')return ymd(add(d,7));const m={monthly:1,quarterly:3,yearly:12}[fq],n=new Date(d.getFullYear(),d.getMonth()+m,1);n.setDate(Math.min(d.getDate(),new Date(n.getFullYear(),n.getMonth()+1,0).getDate()));return ymd(n)}
/* views */
const em=(h,p,b)=>`<div class="p em"><h2>${h}</h2><p>${p}</p>${b||''}</div>`;
const sums=a=>a.reduce((x,y)=>x+y,0);
function dash(){const r=range(),s=stat(r),p=pr(r),q=p&&stat(p),has=q&&(q.n>0);
const dl=(c,v,up)=>!has?'':v===0?(c?'<span class="m">No prior data</span>':''):`<span class="${(c>=v)===up?'g':'rd'}">${c>=v?'▲':'▼'} ${Math.abs((c-v)/Math.abs(v)*100).toFixed(0)}%</span> <span class="m">vs previous period</span>`;
const ob=sums(S.bills.map(owe)),od=S.bills.filter(b=>owe(b)>0&&b.due<today()).length;
if(!S.tx.length&&!S.bills.length)return em('Start with your first transaction','Record a sale or an expense and your totals, charts and reports will appear here.','<button class="btn pri" data-a="addtx">Add transaction</button>');
const k=(l,v,c,d)=>`<div class="k"><div class="l">${l}</div><div class="v ${c}">${v}</div><div>${d||'&nbsp;'}</div></div>`;
const ex=byCat(s.l,'expense'),top=s.l.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount).slice(0,5),up=S.bills.filter(b=>owe(b)>0).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,5);
return`<div class="p kpis">${k('Total income',money(s.i),'g',dl(s.i,q&&q.i,1))}${k('Total expenses',money(s.e),'rd',dl(s.e,q&&q.e,0))}${k('Net profit',money(s.net),s.net>=0?'g':'rd',dl(s.net,q&&q.net,1))}${k('Outstanding bills',money(ob),od?'rd':'',od?od+' overdue':'Nothing overdue')}</div>
<p class="sub">Profit margin <b>${margin(s)}</b> · <b>${s.n}</b> transactions in this period · cash basis (unpaid bills are not counted as expenses)</p>
${s.n?`<div class="g2"><div><div class="p"><div class="ph">Income vs expenses</div><div class="pb"><div class="cc"><canvas id="c1"></canvas></div></div></div><div class="p"><div class="ph">Profit trend</div><div class="pb"><div class="cc"><canvas id="c2"></canvas></div></div></div>
<div class="p"><div class="ph">Recent transactions<button class="btn sm" data-a="go" data-p="tx">View all</button></div>${txTable(s.l.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6),1)}</div></div>
<div><div class="p"><div class="ph">Expenses by category</div><div class="pb cl">${ex.slice(0,7).map(([c,v])=>`<button data-a="cat" data-c="${esc(c)}"><div class="t"><span>${esc(c)}</span><b>${money(v)}</b></div><div class="bar"><i style="width:${v/s.e*100}%"></i></div></button>`).join('')||'<span class="m">No expenses</span>'}</div></div>
<div class="p"><div class="ph">Largest expenses</div><div class="pb">${top.map(t=>`<div class="li"><span>${esc(t.description)}<small class="m">${dt(t.date)} · ${esc(t.category)}</small></span><b class="rd">${money(t.amount)}</b></div>`).join('')||'<span class="m">None</span>'}</div></div>
<div class="p"><div class="ph">Upcoming bills<button class="btn sm" data-a="go" data-p="bills">Manage</button></div><div class="pb">${up.map(b=>{const s=bst(b);return`<div class="li"><span>${esc(b.name)}<small class="m">Due ${dt(b.due)}</small></span><span style="text-align:right"><b>${money(owe(b))}</b><br><span class="bd ${s[1]}">${s[0]}</span></span></div>`}).join('')||'<span class="m">No unpaid bills</span>'}</div></div></div></div>`:em('No transactions in this period','Choose another period or add a transaction.')}`}
function dashCharts(){const s=stat(range());if(!s.n)return;const{mo,b,ks}=bk(s.l),lb=ks.map(k=>mo?k:dt(k));
chart('c1',{type:'bar',data:{labels:lb,datasets:[{label:'Income',data:ks.map(k=>b[k].i),backgroundColor:'#16a34a'},{label:'Expenses',data:ks.map(k=>b[k].e),backgroundColor:'#dc2626'}]},options:opt()});
chart('c2',{type:'line',data:{labels:lb,datasets:[{label:'Net profit',data:ks.map(k=>b[k].i-b[k].e),borderColor:'#2f5bea',backgroundColor:'#2f5bea22',fill:true,tension:.3}]},options:opt()})}
const opt=x=>({maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>` ${c.dataset.label||c.label}: ${money(c.raw)}`}}},scales:{y:{ticks:{callback:v=>money(v)}}},...x});
function chart(id,cfg){const c=$('#'+id);if(!c)return;if(typeof Chart==='undefined'){c.parentElement.innerHTML='<p class="m">Charts need the Chart.js library (internet connection needed once). Your totals are unaffected.</p>';return}const cs=getComputedStyle(document.documentElement);Chart.defaults.color=cs.getPropertyValue('--mut').trim();Chart.defaults.borderColor=cs.getPropertyValue('--line').trim();CH.push(new Chart(c,cfg))}
const allCats=()=>[...new Set([...S.cats.income,...S.cats.expense,...S.tx.map(t=>t.category)])].sort();
function txTable(l,mini){return l.length?`<div class="tw"><table><thead><tr>${mini?'':'<th data-a="sort" data-k="date" tabindex="0">Date'+ar('date')+'</th>'}${mini?'<th>Date</th>':''}<th>Description</th><th>Category</th><th>Payment</th><th>Type</th><th class="r" ${mini?'':'data-a="sort" data-k="amount" tabindex="0"'}>Amount${mini?'':ar('amount')}</th>${mini?'':'<th></th>'}</tr></thead><tbody>${l.map(t=>`<tr><td>${dt(t.date)}</td><td>${esc(t.description)}<small>${esc(t.party)}</small></td><td>${esc(t.category)}</td><td>${esc(t.method)}</td><td><span class="bd ${t.type==='income'?'b-g':'b-r'}">${t.type==='income'?'Income':'Expense'}</span></td><td class="r ${t.type==='income'?'g':'rd'}">${t.type==='income'?'+':'−'}${money(t.amount)}</td>${mini?'':`<td class="r"><button class="btn sm" data-a="edittx" data-id="${t.id}">View / edit</button> <button class="btn sm dg" data-a="deltx" data-id="${t.id}">Delete</button></td>`}</tr>`).join('')}</tbody></table></div>`:''}
const ar=k=>T.k===k?(T.d>0?' ▲':' ▼'):'';
function txs(){const r=range(),q=T.q.toLowerCase();
let l=S.tx.filter(t=>inR(t.date,r)&&(!T.type||t.type===T.type)&&(!T.cat||t.category===T.cat)&&(!T.m||t.method===T.m)&&(!q||[t.description,t.party,t.category,t.notes].some(x=>(x||'').toLowerCase().includes(q))));
l.sort((a,b)=>(a[T.k]>b[T.k]?1:a[T.k]<b[T.k]?-1:0)*T.d||b.date.localeCompare(a.date));
const s={i:0,e:0};l.forEach(t=>t.type==='income'?s.i+=t.amount:s.e+=t.amount);const pages=Math.max(1,Math.ceil(l.length/25));T.pg=Math.min(T.pg,pages);
const so=(a,v,n)=>`<select data-f="${a}" aria-label="${n}"><option value="">${n}</option>${v.map(x=>`<option${T[a]===x?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
return`<div class="p"><div class="fl"><input type="search" id="q" placeholder="Search description, vendor, category, notes" value="${esc(T.q)}" aria-label="Search transactions"><select data-f="type" aria-label="Type"><option value="">All types</option><option value="income"${T.type==='income'?' selected':''}>Income</option><option value="expense"${T.type==='expense'?' selected':''}>Expenses</option></select>${so('cat',allCats(),'All categories')}${so('m',['Cash','Card','Bank transfer','Check','Other'],'All payment methods')}<button class="btn" data-a="csvtx">Export CSV</button></div>
${l.length?txTable(l.slice((T.pg-1)*25,T.pg*25)):em('No transactions found',S.tx.length?'Nothing matches these filters. Try another period or clear the filters.':'Add your first transaction to get started.')}
<div class="pg"><span>${l.length} result(s) · Income ${money(s.i)} · Expenses ${money(s.e)} · Net ${money(s.i-s.e)}</span><span><button class="btn sm" data-a="pg" data-n="-1"${T.pg<2?' disabled':''}>Prev</button> Page ${T.pg} of ${pages} <button class="btn sm" data-a="pg" data-n="1"${T.pg>=pages?' disabled':''}>Next</button></span></div></div>`}
function bills(){const r=range(),t=today(),soon=ymd(add(new Date(),7)),op=S.bills.filter(b=>owe(b)>0),pay=sums(S.bills.flatMap(b=>b.payments.filter(p=>inR(p.date,r)).map(p=>p.amount)));
const l=[...S.bills].sort((a,b)=>(owe(a)===0)-(owe(b)===0)||a.due.localeCompare(b.due)),k=(a,b,c)=>`<div class="k"><div class="l">${a}</div><div class="v ${c||''}">${b}</div></div>`;
return`<div class="p kpis">${k('Total outstanding',money(sums(op.map(owe))))}${k('Overdue',money(sums(op.filter(b=>b.due<t).map(owe))),'rd')}${k('Due in 7 days',money(sums(op.filter(b=>b.due>=t&&b.due<=soon).map(owe))),'')}${k('Paid in selected period',money(pay),'g')}</div><p class="sub">Outstanding balances are liabilities. They only become expenses when you record a payment.</p>
<div class="p"><div class="ph">All bills<button class="btn pri sm" data-a="addbill">Add bill</button></div>${l.length?`<div class="tw"><table><thead><tr><th>Bill</th><th>Due</th><th>Status</th><th class="r">Total</th><th class="r">Paid</th><th class="r">Outstanding</th><th></th></tr></thead><tbody>${l.map(b=>{const s=bst(b);return`<tr><td>${esc(b.name)}<small>${esc(b.vendor)} · ${esc(b.category)}${b.freq&&b.freq!=='none'?' · repeats '+b.freq:''}</small></td><td>${dt(b.due)}</td><td><span class="bd ${s[1]}">${s[0]}</span></td><td class="r">${money(b.total)}</td><td class="r">${money(b.paid)}</td><td class="r ${owe(b)?'rd':''}">${money(owe(b))}</td><td class="r">${owe(b)?`<button class="btn sm" data-a="pay" data-id="${b.id}">Record payment</button> `:''}<button class="btn sm" data-a="editbill" data-id="${b.id}">Edit</button> <button class="btn sm dg" data-a="delbill" data-id="${b.id}">Delete</button></td></tr>`}).join('')}</tbody></table></div>`:em('No bills yet','Add rent, utilities or subscriptions to track balances and due dates.')}</div>`}
function spend(){const s=stat(range());if(!s.n)return em('No data for this period','Add transactions or choose another period to see spending analysis.');
return`<div class="cs"><div class="p"><div class="ph">Expenses by category <span class="m">click a slice</span></div><div class="pb"><div class="cc"><canvas id="c1"></canvas></div></div></div><div class="p"><div class="ph">Top spending categories</div><div class="pb"><div class="cc"><canvas id="c2"></canvas></div></div></div></div><div class="p"><div class="ph">Monthly comparison <span class="m">last 12 months with activity</span></div><div class="pb"><div class="cc"><canvas id="c3"></canvas></div></div></div>`}
function spendCharts(){const s=stat(range());if(!s.n)return;const ex=byCat(s.l,'expense'),pal=['#16a34a','#2f5bea','#d97706','#dc2626','#7c3aed','#0891b2','#ca8a04','#db2777','#64748b','#65a30d','#0d9488','#9333ea'],go=(e,a)=>{if(a[0]){T={...T,type:'expense',cat:ex[a[0].index][0],pg:1};go('tx')}};
chart('c1',{type:'doughnut',data:{labels:ex.map(x=>x[0]),datasets:[{data:ex.map(x=>x[1]),backgroundColor:pal}]},options:{maintainAspectRatio:false,onClick:go,plugins:{legend:{position:'right',labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>` ${c.label}: ${money(c.raw)}`}}}}});
chart('c2',{type:'bar',data:{labels:ex.slice(0,8).map(x=>x[0]),datasets:[{label:'Spent',data:ex.slice(0,8).map(x=>x[1]),backgroundColor:'#dc2626'}]},options:opt({indexAxis:'y',onClick:go,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+money(c.raw)}}},scales:{x:{ticks:{callback:v=>money(v)}}}})});
const m={};S.tx.forEach(t=>{const q=t.date.slice(0,7),x=m[q]||(m[q]={i:0,e:0});t.type==='income'?x.i+=t.amount:x.e+=t.amount});const ks=Object.keys(m).sort().slice(-12);
chart('c3',{type:'bar',data:{labels:ks,datasets:[{label:'Income',data:ks.map(k=>m[k].i),backgroundColor:'#16a34a'},{label:'Expenses',data:ks.map(k=>m[k].e),backgroundColor:'#dc2626'},{label:'Net profit',data:ks.map(k=>m[k].i-m[k].e),backgroundColor:'#2f5bea'}]},options:opt()})}
function rep(){const r=range(),s=stat(r),ic=byCat(s.l,'income'),ex=byCat(s.l,'expense'),row=(a,t)=>a.map(([c,v])=>`<tr><td>${esc(c)}</td><td class="r">${money(v)}</td><td class="r m">${t?(v/t*100).toFixed(1):0}%</td></tr>`).join('')||'<tr><td class="m">No data</td><td></td><td></td></tr>';
return`<div class="pt"><h2>${esc(S.set.name)} — Profit &amp; Loss</h2><p>${label(r)}</p></div><div class="noprint" style="display:flex;gap:8px;margin-bottom:16px"><button class="btn" data-a="csvtx">Export transactions CSV</button><button class="btn" data-a="csvsum">Export summary CSV</button><button class="btn pri" data-a="print">Print profit &amp; loss</button></div>
<div class="p kpis"><div class="k"><div class="l">Income</div><div class="v g">${money(s.i)}</div></div><div class="k"><div class="l">Expenses</div><div class="v rd">${money(s.e)}</div></div><div class="k"><div class="l">Net profit</div><div class="v ${s.net>=0?'g':'rd'}">${money(s.net)}</div></div><div class="k"><div class="l">Profit margin</div><div class="v">${margin(s)}</div></div></div>
<div class="cs"><div class="p tw"><div class="ph">Income by category</div><table><tbody>${row(ic,s.i)}</tbody></table></div><div class="p tw"><div class="ph">Expenses by category</div><table><tbody>${row(ex,s.e)}</tbody></table></div></div>
<div class="p"><div class="ph">Transactions in period (${s.n})</div>${s.n?txTable(s.l.slice().sort((a,b)=>a.date.localeCompare(b.date)),1):'<div class="pb m">No transactions in this period.</div>'}</div>`}
function cats(){const col=ty=>`<div class="p"><div class="ph">${ty==='income'?'Income':'Expense'} categories</div><div class="pb">${S.cats[ty].map(c=>`<div class="li"><span>${esc(c)}</span><span><button class="btn sm" data-a="rencat" data-t="${ty}" data-n="${esc(c)}">Rename</button> <button class="btn sm dg" data-a="delcat" data-t="${ty}" data-n="${esc(c)}">Delete</button></span></div>`).join('')}<div class="li"><input placeholder="New category name" aria-label="New ${ty} category" style="flex:1"><button class="btn sm" data-a="addcat" data-t="${ty}">Add</button></div></div></div>`;return`<div class="cs">${col('income')}${col('expense')}</div>`}
function set(){return`<div class="cs"><div class="p"><div class="ph">Business</div><div class="pb fg"><label class="w">Business name<input data-s="name" value="${esc(S.set.name)}"></label><label>Currency<select data-s="cur">${['USD','EUR','GBP','CAD','AUD','MXN','INR','JPY'].map(c=>`<option${c===S.set.cur?' selected':''}>${c}</option>`).join('')}</select></label><label>Theme<select data-s="theme"><option value="light"${S.set.theme==='light'?' selected':''}>Light</option><option value="dark"${S.set.theme==='dark'?' selected':''}>Dark</option></select></label></div></div>
<div class="p"><div class="ph">Your data</div><div class="pb"><p class="m" style="margin-top:0">Everything is saved in this browser on this device (localStorage). There is no cloud storage, account or automatic backup, so export a backup regularly.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-a="backup">Export JSON backup</button><button class="btn" data-a="import">Import backup</button><button class="btn dg" data-a="wipe">Reset all data</button></div></div></div></div>`}
/* forms */
const f=(l,n,v,a='',c='')=>`<label class="${c}">${l}<input name="${n}" value="${esc(v??'')}" ${a}></label>`,sl=(l,n,o,v,c='')=>`<label class="${c}">${l}<select name="${n}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}"${a===v?' selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;
function modal(title,html,ok,fn){const d=$('#dlg');busy=0;d.innerHTML=`<form id="mf" novalidate><h2>${title}</h2><div class="fg">${html}</div><p class="er" id="er" role="alert"></p><div class="ac"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri">${ok}</button></div></form>`;
$('#mf').onsubmit=e=>{e.preventDefault();if(busy)return;const er=fn(Object.fromEntries(new FormData(e.target)));if(er)$('#er').textContent=er;else{busy=1;d.close();save();render()}};d.showModal()}
function txForm(id){const t=S.tx.find(x=>x.id===id)||{date:today(),type:'expense',method:'Cash'},co=ty=>S.cats[ty].includes(t.category)||ty!==t.type?S.cats[ty]:[t.category,...S.cats[ty]];
modal(id?'Transaction details':'Add transaction',`${sl('Type','type',[['income','Income'],['expense','Expense']],t.type)}${f('Date','date',t.date,'type="date" required')}${f('Description','description',t.description,'required','w')}${sl('Category','category',co(t.type),t.category)}${f('Amount','amount',t.amount,'type="number" step="0.01" min="0.01" required')}${sl('Payment method','method',['Cash','Card','Bank transfer','Check','Other'],t.method)}${f('Customer / vendor (optional)','party',t.party)}<label class="w">Notes (optional)<textarea name="notes" rows="2">${esc(t.notes||'')}</textarea></label>`,'Save',d=>{
const a=parseFloat(d.amount);if(!d.description.trim())return'Enter a description.';if(!d.date)return'Choose a date.';if(!(a>0))return'Amount must be greater than zero.';const o={...d,description:d.description.trim(),amount:Math.round(a*100)/100};
if(id)Object.assign(t,o);else S.tx.push({id:uid(),...o});toast(id?'Transaction updated.':'Transaction added.')});
$('[name=type]').onchange=e=>{$('[name=category]').innerHTML=S.cats[e.target.value].map(c=>`<option>${esc(c)}</option>`).join('')}}
function billForm(id){const b=S.bills.find(x=>x.id===id)||{due:today(),freq:'none'};
modal(id?'Edit bill':'Add bill',`${f('Bill name','name',b.name,'required','w')}${f('Vendor','vendor',b.vendor)}${sl('Category','category',S.cats.expense,b.category)}${f('Total amount','total',b.total,'type="number" step="0.01" min="0.01" required')}${f('Due date','due',b.due,'type="date" required')}${sl('Repeats','freq',[['none','Does not repeat'],['weekly','Weekly'],['monthly','Monthly'],['quarterly','Quarterly'],['yearly','Yearly']],b.freq)}<label class="w">Notes (optional)<textarea name="notes" rows="2">${esc(b.notes||'')}</textarea></label>`,'Save',d=>{
const a=parseFloat(d.total);if(!d.name.trim())return'Enter a bill name.';if(!d.due)return'Choose a due date.';if(!(a>0))return'Total must be greater than zero.';if(id&&a<b.paid)return'Total cannot be below the amount already paid ('+money(b.paid)+').';
const o={...d,name:d.name.trim(),total:a};if(id)Object.assign(b,o);else S.bills.push({id:uid(),recurId:uid(),paid:0,payments:[],...o});toast('Bill saved.')})}
function payForm(id){const b=S.bills.find(x=>x.id===id);modal('Record payment — '+esc(b.name),`${f('Amount (outstanding '+money(owe(b))+')','amount',owe(b),'type="number" step="0.01" min="0.01" required')}${f('Payment date','date',today(),'type="date" required')}<label class="w" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="exp" checked style="width:auto"> Also record this payment as an expense transaction</label>`,'Record payment',d=>{
const a=Math.round(parseFloat(d.amount)*100)/100;if(!(a>0))return'Enter an amount greater than zero.';if(a>owe(b)+.001)return'Payment is more than the outstanding balance.';if(!d.date)return'Choose a date.';
const p={id:uid(),date:d.date,amount:a};if(d.exp){const t={id:uid(),date:d.date,type:'expense',description:b.name,category:b.category,amount:a,method:'Bank transfer',party:b.vendor,notes:'Bill payment',billId:b.id,payId:p.id};S.tx.push(t);p.txId=t.id}
b.payments.push(p);b.paid=Math.round((b.paid+a)*100)/100;
if(owe(b)===0&&b.freq&&b.freq!=='none'){const n=nextDue(b.due,b.freq);if(!S.bills.some(x=>x.recurId===b.recurId&&x.due===n))S.bills.push({...b,id:uid(),due:n,paid:0,payments:[]})}toast('Payment recorded.')})}
/* export / import */
function dl(n,txt,ty){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:ty}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){toast('Export failed: '+e.message,1)}}
const csv=rows=>'\ufeff'+rows.map(r=>r.map(v=>typeof v==='number'?v.toFixed(2):'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
function csvTx(){const l=stat(range()).l.sort((a,b)=>a.date.localeCompare(b.date));dl(`transactions-${today()}.csv`,csv([['Date','Description','Category','Payment Method','Type','Amount','Customer/Vendor','Notes'],...l.map(t=>[t.date,t.description,t.category,t.method,t.type,t.amount,t.party,t.notes])]),'text/csv');toast(`Exported ${l.length} transactions.`)}
function csvSum(){const r=range(),s=stat(r);dl(`summary-${today()}.csv`,csv([['Business',S.set.name],['Period',label(r)],['Total income',s.i],['Total expenses',s.e],['Net profit',s.net],['Profit margin',margin(s)],[],['Type','Category','Total'],...byCat(s.l,'income').map(x=>['Income',...x]),...byCat(s.l,'expense').map(x=>['Expense',...x])]),'text/csv')}
function imp(file){const fr=new FileReader();fr.onerror=()=>toast('Could not read file.',1);fr.onload=()=>{try{const o=JSON.parse(fr.result),d=o.data||o,D=/^\d{4}-\d{2}-\d{2}$/;if(!Array.isArray(d.tx)||!Array.isArray(d.bills))throw Error('Not a valid backup file.');
d.tx.forEach((t,i)=>{if(!D.test(t.date)||!(t.amount>0)||!['income','expense'].includes(t.type))throw Error('Transaction #'+(i+1)+' is invalid.');t.id=t.id||uid()});
d.bills.forEach((b,i)=>{if(!D.test(b.due)||!(b.total>0))throw Error('Bill #'+(i+1)+' is invalid.');b.id=b.id||uid();b.payments=b.payments||[];b.paid=b.paid||0;b.recurId=b.recurId||uid()});
if(!confirm(`Replace ALL current data with ${d.tx.length} transactions and ${d.bills.length} bills from this file?`))return;S=norm(d);save();render();toast('Backup restored.')}catch(e){toast('Import failed: '+e.message,1)}};fr.readAsText(file)}
/* app */
function go(p){P=p;render()}
function syncTB(){$('#fp').value=F.p;$('#cu').hidden=F.p!=='custom';$('#ff').value=F.from;$('#ft').value=F.to}
function render(){CH.forEach(c=>c.destroy());CH=[];document.documentElement.dataset.theme=S.set.theme;$('#bn').textContent=S.set.name;$('#lg').textContent=(S.set.name.trim()[0]||'M').toUpperCase();$('#av').textContent=$('#lg').textContent;document.title=S.set.name+' · Finance';
$('#nav').innerHTML=NAV.map(n=>`<a tabindex="0" data-a="go" data-p="${n[0]}" class="${P===n[0]?'on':''}">${ic(n[2])}${n[1]}</a>`).join('');const nv=NAV.find(n=>n[0]===P);$('#ti').textContent=nv[1];$('#de').textContent=nv[3];
$('#pb').innerHTML=P==='bills'?ic('plus')+'Add bill':ic('plus')+'Add transaction';$('#pb').dataset.a=P==='bills'?'addbill':'addtx';
$$('[data-a=step]').forEach((b,i)=>b.innerHTML=ic(i?'r':'l'));$('[data-a=menu]').innerHTML=ic('menu');$('#tb').hidden=['cats','set'].includes(P);$('#rl').textContent=label(range());syncTB();
$('#v').innerHTML=({dash,tx:txs,bills,spend,rep,cats,set})[P]();$('#side').classList.remove('open');if(P==='dash')dashCharts();if(P==='spend')spendCharts()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,c=el.dataset.c,ty=el.dataset.t,n=el.dataset.n;
switch(a){case'go':go(el.dataset.p);break;case'menu':$('#side').classList.toggle('open');break;case'close':$('#dlg').close();break;
case'step':{const r=range();if(!r.from)return toast('All time has no previous or next period.',1);const u=unit(),x=shift(r,u,+n);F={p:'custom',from:x.from,to:x.to,u};T.pg=1;render();break}
case'sort':T=T.k===el.dataset.k?{...T,d:-T.d}:{...T,k:el.dataset.k,d:-1};render();break;case'pg':T.pg+=+n;render();break;
case'cat':T={...T,type:'expense',cat:c,pg:1};go('tx');break;
case'addtx':txForm();break;case'edittx':txForm(id);break;case'deltx':if(confirm('Permanently delete this transaction?')){S.tx=S.tx.filter(t=>t.id!==id);save();render();toast('Transaction deleted.')}break;
case'addbill':billForm();break;case'editbill':billForm(id);break;case'pay':payForm(id);break;
case'delbill':if(confirm('Delete this bill? Expense transactions already recorded for it are kept.')){S.bills=S.bills.filter(b=>b.id!==id);save();render()}break;
case'csvtx':csvTx();break;case'csvsum':csvSum();break;case'print':window.print();break;
case'backup':dl(`ledgerline-backup-${today()}.json`,JSON.stringify({app:'ledgerline',version:2,exported:new Date().toISOString(),data:S},null,2),'application/json');toast('Backup downloaded.');break;case'import':$('#imp').click();break;
case'wipe':if(confirm('Delete ALL transactions, bills, categories and settings?')&&confirm('This cannot be undone. Really delete everything?')){S=DEF();save();render();toast('All data deleted.')}break;
case'addcat':{const v=el.parentElement.querySelector('input').value.trim();if(!v)return toast('Enter a category name.',1);if(S.cats[ty].some(x=>x.toLowerCase()===v.toLowerCase()))return toast('That category already exists.',1);S.cats[ty].push(v);save();render();break}
case'rencat':{const v=(prompt('Rename category',n)||'').trim();if(!v||v===n)return;if(S.cats[ty].includes(v))return toast('That category already exists.',1);S.cats[ty]=S.cats[ty].map(x=>x===n?v:x);S.tx.forEach(t=>{if(t.type===ty&&t.category===n)t.category=v});S.bills.forEach(b=>{if(ty==='expense'&&b.category===n)b.category=v});save();render();break}
case'delcat':if(confirm(`Delete “${n}”? Existing records keep this category name.`)){S.cats[ty]=S.cats[ty].filter(x=>x!==n);save();render()}break}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.side a,th[data-a]'))e.target.click()});
document.addEventListener('input',e=>{if(e.target.id==='q'){T.q=e.target.value;T.pg=1;const p=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.f){T[t.dataset.f]=t.value;T.pg=1;render()}else if(t.dataset.s){S.set[t.dataset.s]=t.value;save();render()}else if(t.id==='imp'&&t.files[0]){imp(t.files[0]);t.value=''}});
$('#fp').onchange=e=>{const t=today();F={p:e.target.value,from:e.target.value==='custom'?t.slice(0,8)+'01':'',to:e.target.value==='custom'?t:'',u:''};T.pg=1;render()};
$('#ff').onchange=e=>{F.from=e.target.value;F.u='';render()};$('#ft').onchange=e=>{F.to=e.target.value;F.u='';render()};
$('#fj').onchange=e=>{if(e.target.value){F={p:'custom',from:e.target.value,to:e.target.value,u:'d'};e.target.value='';render()}};
render();
</script></body></html>
